<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - ChillZone</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@300;400;500&family=Alatsi&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="login.css">

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

  <div class="nav-inner">

    <!-- LOGO -->
    <h1 class="logo">ChillZone</h1>

    <!-- MENU -->
    <nav class="menu">

      <a href="../../HOME/home.html">
        Home
      </a>

      <a href="../../SPOT/Rekomendasi_Spot/spot_rekomendasi.html">
        Spots
      </a>

      <a href="../../REVIEW/review.html">
        Review
      </a>

      <a href="../../ARTICLE/article.html">
        Article
      </a>

    </nav>

    <!-- PROFILE -->
    <img 
      src="../../KEBUTUHAN ELEMENT/user icon 1.png"
      class="profile"
      alt=""
    >

  </div>

</header>

<!-- LOGIN -->
<section class="login">

  <div class="container login-wrap">

    <!-- LEFT -->
    <div class="login-left">

      <h2>Welcome Back</h2>

      <p>
        Welcome back! Please enter your details.
      </p>

      <!-- FORM LOGIN -->
      <form 
        action="../../backend/login.php" 
        method="POST"
      >

        <!-- EMAIL -->
        <label>Email</label>

        <input
          type="email"
          name="email"
          placeholder="Enter your email"
          required
        >

        <!-- PASSWORD -->
        <label>Password</label>

        <div class="password-box">

  <input
    type="password"
    name="password"
    id="loginPassword"
    placeholder="Enter Password"
  >

  <span
    class="toggle-password"
    onclick="toggleLoginPassword()"
  >
    👁
  </span>

</div>

        <!-- LOGIN BUTTON -->
        <button 
          type="submit" 
          class="btn login-btn"
        >
          Login
        </button>

        <!-- GOOGLE -->
        <div class="google-btn">

          <img
            src="../../KEBUTUHAN ELEMENT/google.png"
            alt=""
          >

          <span>
            Sign In with Google
          </span>

        </div>

        <!-- EXTRA -->
        <div class="extra">

          <!-- REMEMBER -->
          <label class="remember">

            <input type="checkbox">

            <span>
              Remember me
            </span>

          </label>

          <!-- FORGOT -->
          <a href="#" class="forgot">
            Forgot Password?
          </a>

        </div>

        <!-- SIGNUP -->
        <p class="signup">

          Don’t have an account?

          <a href="../Signup/signup.html">
            Sign Up
          </a>

        </p>

      </form>

    </div>

    <!-- RIGHT -->
    <div class="login-right">

      <img
        src="../../KEBUTUHAN ELEMENT/ChillZOne.png"
        alt=""
      >

    </div>

  </div>

</section>

<!-- FOOTER -->
<footer>

  <p>
    © 2026 ChillZone. All rights reserved.
  </p>

  <p>
    Create your vibe · Zone your moment · Own your experience
  </p>

</footer>

<script>

function toggleLoginPassword(){

  const passwordInput =
  document.getElementById(
    "loginPassword"
  );

  if(passwordInput.type === "password"){

    passwordInput.type = "text";

  }

  else{

    passwordInput.type = "password";

  }

}

</script>

</body>
</html>
