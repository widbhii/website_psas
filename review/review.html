<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Review - ChillZone</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@300;400;500;600;700&family=Alatsi&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="review.css">

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

  <div class="nav-inner">

    <h1 class="logo">ChillZone</h1>

    <nav class="menu">

      <a href="../HOME/home.html">
        Home
      </a>

      <a href="../SPOT/Rekomendasi_Spot/spot_rekomendasi.html">
        Spots
      </a>

      <a href="review.html" class="active">
        Review
      </a>

      <a href="../ARTICLE/article.html">
        Article
      </a>

    </nav>

    <img 
      src="../KEBUTUHAN ELEMENT/user icon 1.png" 
      class="profile"
    >

  </div>

</header>

<!-- REVIEW -->
<section class="review-section">

  <!-- TITLE -->
  <div class="review-title">

    <h2>
      User Reviews
    </h2>

    <p>
      See what people say about their favorite places.
    </p>

  </div>

  <!-- REVIEW WRAP -->
  <div class="review-wrap" id="reviewWrap">

  </div>

  <!-- BUTTON -->
  <div class="review-btn-wrap">

    <a href="add_review.html" class="write-btn">
      + Write Your Review
    </a>

  </div>

</section>

<!-- FOOTER -->
<footer>

  <p>
    © 2026 ChillZone. All rights reserved.
  </p>

  <p>
    Create your vibe · Zone your moment · Own your experience
  </p>

</footer>

<!-- SCRIPT -->
<script>

/* =========================
   CONTAINER
========================= */

const reviewWrap =
document.getElementById("reviewWrap");

/* =========================
   FETCH REVIEW
========================= */

fetch("../backend/fetch_review.php")

.then(response => response.json())

.then(data => {

  /* KALAU BELUM ADA REVIEW */

  if(data.length === 0){

    reviewWrap.innerHTML = `

      <p class="empty-review">
        No reviews yet.
      </p>

    `;

    return;
  }

  /* LOOP REVIEW */

  data.forEach(review => {

    /* BIKIN BINTANG */

    let stars = "";

    for(let i = 0; i < review.rating; i++){

      stars += "★";

    }

    /* AMBIL INISIAL */

    const initials =
    review.username
    .substring(0,2)
    .toUpperCase();

    /* CARD */

    reviewWrap.innerHTML += `

      <div class="review-card">

        <div class="review-top">

          <div class="profile-circle brown">
            ${initials}
          </div>

          <div>

            <h3>
              ${review.username}
            </h3>

            <div class="stars">
              ${stars}
            </div>

          </div>

        </div>

        <!-- TEMPAT -->
        <div class="place-tag">
          ${review.place_name}
        </div>

        <!-- REVIEW -->
        <p class="review-text">
          "${review.review_text}"
        </p>

      </div>

    `;

  });

})

.catch(error => {

  console.log(error);

});

</script>

</body>
</html>
