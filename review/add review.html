<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tulis Ulasan - ChillZone</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@300;400;500;600;700&family=Alatsi&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="add review.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <h1 class="logo">ChillZone</h1>
      <nav class="menu">
        <a href="../HOME/home.html">Home</a>
        <a href="../SPOT/Rekomendasi_Spot/spot_rekomendasi.html">Spots</a>
        <a href="review.html" class="active">Review</a>
        <a href="../ARTICLE/article.html">Article</a>
      </nav>
      <img src="../KEBUTUHAN ELEMENT/user icon 1.png" class="profile">
    </div>
  </header>

  <div class="review-card">
    <h2 class="review-title">Tulis Ulasan Kamu</h2>
    
    <form id="reviewForm" class="review-form">
      <div class="form-group">
        <label for="reviewerName" class="form-label">Nama Lengkap</label>
        <input type="text" id="reviewerName" class="form-input" placeholder="Masukkan nama kamu..." required>
      </div>

      <div class="form-group">
        <label class="form-label">Rating</label>
        <div class="star-rating" id="starRating">
          <button type="button" data-value="1" class="star-btn">★</button>
          <button type="button" data-value="2" class="star-btn">★</button>
          <button type="button" data-value="3" class="star-btn">★</button>
          <button type="button" data-value="4" class="star-btn">★</button>
          <button type="button" data-value="5" class="star-btn">★</button>
        </div>
        <input type="hidden" id="ratingValue" value="0" required>
      </div>

      <div class="form-group">
        <label for="reviewText" class="form-label">Ulasan</label>
        <textarea id="reviewText" class="form-input" rows="4" placeholder="Ceritakan pengalaman kamu..." required></textarea>
      </div>

      <div class="button-group">
        <button type="submit" class="submit-btn">Kirim Ulasan</button>
        <a href="review.html" class="cancel-link">Batal</a>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
