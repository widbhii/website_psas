<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - ChillZone</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@300;400;500&family=Alatsi&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="signup.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-inner">

    <h1 class="logo">ChillZone</h1>

    <nav class="menu">
      <a href="index.html" class="active">Home</a>
      <a href="spots.html">Spots</a>
      <a href="review.html">Review</a>
      <a href="article.html">Article</a>
    </nav>

    <img src="user icon 1.png" class="profile">

  </div>
</header>

<!-- SIGN UP -->
<section class="signup-section">
  <div class="container signup-wrap">

    <!-- LEFT -->
    <div class="signup-left">

      <h2>Get Started Now</h2>
      <p>Please enter your details.</p>

      <form>

        <!-- NAME -->
        <label>Name</label>
        <input type="text" placeholder="Enter your name" required>

        <!-- EMAIL -->
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <!-- PASSWORD -->
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <small>Must be at least 8 characters.</small>

        <!-- BUTTON -->
        <button type="submit" class="btn">
          Create Account
        </button>

        <!-- GOOGLE -->
        <div class="google-btn">
          <img src="google.png" alt="">
          <span>Sign In with Google</span>
        </div>

        <!-- LOGIN -->
        <p class="signin">
          Already have an account?
          <a href="login.html">Sign In</a>
        </p>

      </form>

    </div>

    <!-- RIGHT -->
    <div class="signup-right">
      <img src="building.png" alt="">
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 ChillZone. All rights reserved.</p>
  <p>Create your vibe · Zone your moment · Own your experience</p>
</footer>

</body>
</html>
