<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - ChillZone</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@300;400;500&family=Alatsi&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-inner">
    <h1 class="logo">ChillZone</h1>

    <nav class="menu">
      <a href="index.html" class="active">Home</a>
      <a>Spots</a>
      <a>Review</a>
      <a>Article</a>
    </nav>

    <img src="user icon 1.png" class="profile">
  </div>
</header>

<!-- LOGIN -->
<section class="login">
  <div class="container login-wrap">

    <!-- LEFT -->
    <div class="login-left">
      <h2>Welcome Back</h2>
      <p>Welcome back! Please enter your details.</p>

      <form>

        <!-- EMAIL -->
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <!-- PASSWORD -->
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <!-- LOGIN BUTTON -->
        <button type="submit" class="btn">Login</button>

        <!-- GOOGLE -->
        <div class="google-btn">
          <img src="google.png" alt="">
          <span>Sign In with Google</span>
        </div>

        <!-- EXTRA (FIXED) -->
        <div class="extra">
          <label class="remember">
            <input type="checkbox">
            <span>Remember me</span>
          </label>

          <a href="#" class="forgot">Forgot Password?</a>
        </div>

        <!-- SIGN UP -->
        <p class="signup">
          Don’t have an account? <a href="#">Sign Up</a>
        </p>

      </form>
    </div>

    <!-- RIGHT -->
    <div class="login-right">
      <img src="building.png" alt="">
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 ChillZone. All rights reserved.</p>
  <p>Create your vibe · Zone your moment · Own your experience</p>
</footer>

</body>
</html>
