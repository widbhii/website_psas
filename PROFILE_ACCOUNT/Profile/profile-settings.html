<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Account Settings - ChillZone</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Alatsi&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="profile-settings.css">
</head>

<body>

  <div class="settings-container">

    <!-- SIDEBAR -->
    <div class="sidebar">

      <button class="sidebar-btn active">
        Account Settings
      </button>

      <button class="sidebar-btn">
        Preferences
      </button>

      <button class="sidebar-btn">
        Saved Content
      </button>

      <button class="sidebar-btn">
        Support
      </button>

      <button class="sidebar-btn">
        Log Out
      </button>

    </div>

    <!-- CONTENT -->
    <div class="settings-content">

      <h1>Account Settings</h1>

      <!-- PROFILE -->
      <div class="profile-section">

        <div class="profile-image-box">

          <img
            src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=2043&auto=format&fit=crop"
            class="profile-image"
          >

          <img
            src="../../KEBUTUHAN ELEMENT/profile.png"
            class="edit-icon"
          >

        </div>

        <div class="profile-info">

          <h2>Your Name</h2>
          <p>youremail@gmail.com</p>

        </div>

      </div>

      <!-- FORM -->
      <div class="settings-form">

        <div class="input-group">
          <label>Change Username</label>
          <input type="text" placeholder="Change your Name">
        </div>

        <div class="input-group">
          <label>Change Email</label>
          <input type="email" placeholder="Change your Email">
        </div>

        <div class="input-group">
          <label>Change Password</label>
          <input type="password" placeholder="Change your Password">
        </div>

      </div>

    </div>

  </div>

</body>
</html>
