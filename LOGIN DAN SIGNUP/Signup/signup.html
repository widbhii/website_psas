<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up - ChillZone</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Poppins:wght@300;400;500&family=Alatsi&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="signup.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

  <div class="nav-inner">

    <!-- LOGO -->
    <h1 class="logo">ChillZone</h1>

    <!-- MENU -->
    <nav class="menu">

      <a href="../../HOME/home.html">
        Home
      </a>

      <a href="../../SPOT/Rekomendasi_Spot/spot_rekomendasi.html">
        Spots
      </a>

      <a href="../../REVIEW/review.html">
        Review
      </a>

      <a href="../../ARTICLE/article.html">
        Article
      </a>

    </nav>

    <!-- PROFILE -->
    <img
      src="../../KEBUTUHAN ELEMENT/user icon 1.png"
      class="profile"
      alt=""
    >

  </div>

</header>

<!-- SIGN UP -->
<section class="signup-section">

  <div class="container signup-wrap">

    <!-- LEFT -->
    <div class="signup-left">

      <h2>Get Started Now</h2>

      <p>
        Please enter your details.
      </p>

      <form>

        <!-- NAME -->
        <label>Name</label>

        <input
          type="text"
          placeholder="Enter your name"
          required
        >

        <!-- EMAIL -->
        <label>Email</label>

        <input
          type="email"
          placeholder="Enter your email"
          required
        >

        <!-- PASSWORD -->
        <label>Password</label>

        <input
          type="password"
          placeholder="Enter your password"
          required
        >

        <!-- NOTE -->
        <small class="password-note">
          Must be at least 8 characters.
        </small>

        <!-- BUTTON -->
        <a href="../../HOME/home.html" class="signup-btn">
          Create Account
        </a>

        <!-- GOOGLE -->
        <div class="google-btn">

          <img
            src="../../KEBUTUHAN ELEMENT/google.png"
            alt=""
          >

          <span>
            Sign In with Google
          </span>

        </div>

        <!-- LOGIN -->
        <p class="signin">

          Already have an account?

          <a href="../Login/login.html">
            Sign In
          </a>

        </p>

      </form>

    </div>

    <!-- RIGHT -->
    <div class="signup-right">

      <img
      src="../../KEBUTUHAN ELEMENT/ChillZOne.png"
      alt=""
>
      >

    </div>

  </div>

</section>

<!-- FOOTER -->
<footer>

  <p>
    © 2026 ChillZone. All rights reserved.
  </p>

  <p>
    Create your vibe · Zone your moment · Own your experience
  </p>

</footer>

</body>
</html>
